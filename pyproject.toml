[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iaqualink-robots"
# PEP 440 spelling of the manifest's "3.0.0-rc.2". The two differ by
# necessity: HACS/HA read manifest.json (SemVer), Python packaging reads this
# (PEP 440, which has no hyphen/dot form for pre-releases). manifest.json is
# authoritative for what users install.
version = "3.0.0rc3"
description = "Home Assistant custom integration for iAqualink pool robots."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{name = "galletn"}]

[tool.setuptools]
# Explicitly list the only package we ship; setuptools-auto-discover otherwise
# trips on the `samples/` sibling directory.
packages = ["custom_components.iaqualink_robots"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-homeassistant-custom-component>=0.13.190",
    "aioresponses>=0.7.6",
]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-aiofiles",
]

# ---------------------------------------------------------------------------
# ruff
#
# Added alongside flake8 rather than replacing it, for one rule that flake8
# cannot express without a plugin: G004 (f-string in a logging call). That is
# the rule that keeps the lazy-%-formatting sweep from regressing — at a 3s
# poll interval an eagerly formatted debug string is permanent wasted CPU.
#
# line-length matches the existing .flake8 value (200) on purpose: the goal
# here is a regression gate, not a reformat of the whole codebase. Tightening
# toward HA core's 88 is a separate, deliberate piece of work.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 200
target-version = "py313"
exclude = ["samples", "tools"]

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "G",     # flake8-logging-format  <- G004 is the reason ruff is here
    "LOG",   # flake8-logging
    "T20",   # no print() in the integration
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately print diagnostics and build long literal payloads.
"tests/**" = ["T20"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Project root on sys.path so `from custom_components.iaqualink_robots import ...`
# resolves without a fragile editable install (Python 3.13 + setuptools 80+ has
# known issues with editable_mode=lax; this sidesteps it entirely).
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=custom_components.iaqualink_robots",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["custom_components/iaqualink_robots"]
branch = true
omit = [
    "tests/*",
    "custom_components/iaqualink_robots/samples/*",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "pass",
    "\\.\\.\\.",
]
# Ratcheted from the P1 bootstrap value of 5 (which never failed on anything)
# to just under the suite's real number, measured in CI: 69% at 3.0.0-rc.4.
# The point is that a regression now breaks the build; the gap to the
# quality-scale `test-coverage` rule (95%) is real and tracked in
# quality_scale.yaml rather than papered over with an aspirational number
# that would fail every run.
#
# Raise this whenever coverage climbs. Do NOT lower it to make a red build
# green -- that is the one change this line exists to prevent.
fail_under = 67
show_missing = true
skip_covered = false
