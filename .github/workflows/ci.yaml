name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs on the same PR/branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # hassfest — HA's official manifest/strings validator.
  #
  # This is now a REAL GATE. It was informational (continue-on-error) for two
  # known errors, and BOTH are resolved:
  #
  #   1. "Domain does not match dir name" — was `iaqualinkRobots` (camelCase)
  #      vs. directory `iaqualink_robots`. The domain is now `iaqualink_robots`
  #      in both manifest.json and const.DOMAIN, matching the directory, so
  #      this cannot fire. (Issue #97.)
  #   2. "Invalid translations/en.json: extra keys not allowed @ data['entity']
  #      ['vacuum']['fan_speed']" — the fan-speed state translations now live
  #      under `entity.sensor.fan_speed.state`, which IS schema-valid, and
  #      `entity.vacuum` is an empty object. So this cannot fire either.
  #
  # A passing hassfest is a prerequisite for any HA-core submission (issue
  # #99), and letting it fail silently is how manifest/strings drift goes
  # unnoticed until a user reports it. If it fails, fix the integration —
  # do not restore continue-on-error.
  # ---------------------------------------------------------------------------
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  # ---------------------------------------------------------------------------
  # flake8 — uses existing .flake8 (max-line-length = 200).
  # ---------------------------------------------------------------------------
  flake8:
    name: flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install flake8
      - run: flake8 custom_components/iaqualink_robots

  # ---------------------------------------------------------------------------
  # ruff — config in pyproject.toml. Runs alongside flake8 for the logging
  # rules flake8 cannot express without a plugin, chiefly G004 (no f-strings
  # in logging calls): at SCAN_INTERVAL=3s an eagerly formatted debug string
  # is permanent wasted CPU even with debug logging switched off.
  # ---------------------------------------------------------------------------
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      - run: ruff check custom_components/iaqualink_robots tests

  # ---------------------------------------------------------------------------
  # mypy — bootstrap config flipped every module to `ignore_errors = False`
  # in story P6. mypy needs to resolve `from homeassistant ...` imports, so
  # we install `homeassistant` alongside mypy — without it every HA import
  # surfaces as `import-not-found` and the strict pass fails on every line.
  # ---------------------------------------------------------------------------
  mypy:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install mypy homeassistant voluptuous aiohttp
      - run: mypy --config-file=mypy.ini custom_components/iaqualink_robots

  # ---------------------------------------------------------------------------
  # pytest — runs the full suite with coverage. The threshold in
  # pyproject.toml's [tool.coverage.report].fail_under starts low (5%) and
  # is ratcheted up per-story until Platinum's 95% target is met.
  # ---------------------------------------------------------------------------
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        # NB: deliberately NOT `pip install -e .` — Python 3.13 + setuptools 80+
        # editable install has known issues. pyproject.toml's
        # [tool.pytest.ini_options].pythonpath puts the project root on
        # sys.path so `from custom_components.iaqualink_robots import ...`
        # resolves naturally.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest>=8.0" \
            "pytest-asyncio>=0.23" \
            "pytest-cov>=5.0" \
            "pytest-homeassistant-custom-component>=0.13.190" \
            "aioresponses>=0.7.6"
      - name: Run tests
        run: pytest
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
